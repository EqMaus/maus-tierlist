<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071018">
  <meta name="description" content="Tier list personal e interactiva de videojuegos de Maus.">
  <title>Tier List de Maus — v4.3.3</title>
  <link rel="stylesheet" href="css/styles.css?v=4.3.3">
</head>
<body data-scene="default">
  <canvas id="stormCanvas" class="storm-canvas" aria-hidden="true"></canvas>
  <div id="stormFlash" class="storm-flash" aria-hidden="true"></div>
  <div id="sceneBackdrop" class="scene-backdrop" aria-hidden="true">
    <div class="scene-base"></div>
    <div class="scene-glow"></div>
  </div>
  <div id="sceneArt" class="scene-art" aria-hidden="true"></div>
  <div class="screen-vignette" aria-hidden="true"></div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#tierlist" data-nav="tierlist" aria-label="Ir a la tier list">
        <img class="brand-mark" src="assets/brand/simba.jpg" alt="Simba">
        <span class="brand-copy"><strong>TIER LIST</strong><small>de Maus</small></span>
      </a>
      <nav class="main-nav" aria-label="Navegación principal">
        <a href="#tierlist" data-nav="tierlist">Tier list</a>
        <a href="#games" data-nav="games">Reviews</a>
      </nav>
      <button id="backgroundViewButton" class="background-view-button" type="button" aria-label="Ocultar interfaz y ver el fondo" title="Ver fondo" hidden>◫ <span>Ver fondo</span></button>
    </div>
  </header>

  <main id="app" class="app-shell" tabindex="-1"></main>

  <button id="restoreUiButton" class="restore-ui-button" type="button" hidden>Devolver interfaz</button>

  <section id="player" class="music-widget" hidden aria-label="Tema musical del juego">
    <strong id="playerTitle" class="music-widget-title">—</strong>
    <small id="playerGame" class="music-widget-game">—</small>
    <label class="music-widget-volume">
      <span>Volumen</span>
      <input id="playerVolume" class="range volume-range" type="range" min="0" max="100" value="52" aria-label="Volumen">
    </label>
    <button id="themeInfoButton" class="theme-info-button" type="button">Información del tema</button>
    <audio id="audio" preload="metadata" loop></audio>
  </section>

  <div id="themeInfoModal" class="theme-info-modal" hidden>
    <section class="theme-info-panel" role="dialog" aria-modal="true" aria-labelledby="themeInfoHeading">
      <button id="themeInfoClose" class="theme-info-close" type="button" aria-label="Cerrar información del tema">×</button>
      <div id="themeInfoContent"></div>
    </section>
  </div>

  <div id="saveToast" class="save-toast" hidden>Guardado</div>

  <script src="js/site-data.js?v=4.3.3"></script>
  <script src="js/theme-music.js?v=4.3.3"></script>
  <script src="js/app.js?v=4.3.3"></script>
  <script src="js/storm.js?v=4.3.3"></script>
</body>
</html>
